name: Refresh research and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh official sources
        if: github.event_name != 'push'
        run: npm run update:research
      - name: Validate source parsers and worked examples
        run: node --test scripts/research-feeds.test.mjs scripts/conference-feeds.test.mjs scripts/robotics-feeds.test.mjs scripts/robotics-conferences.test.mjs scripts/daily-updates.test.mjs scripts/examples.test.mjs scripts/unified-robotics.test.mjs scripts/security-news-feeds.test.mjs
      - name: Commit research snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research.json data/conferences.json data/robotics-security.json data/robotics-conferences.json data/security-news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official AI research snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - run: npm run build
      - name: Validate content integrity
        run: node scripts/check-content.mjs
      - name: Validate deployable research data
        run: node scripts/check-research-data.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
